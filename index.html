<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KimBH04</title>
    <!-- 배포 시 404.html 로 복사되어 /post/... 같은 깊은 주소에서도 쓰이므로 경로는 모두 / 로 시작한다 -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/post.css" />
    <link rel="stylesheet" href="/css/games.css" />
    <link rel="stylesheet" href="/css/write.css" />
    <script type="module" src="/js/app.js"></script>
</head>

<body>
    <div class="Window">
        <div class="TitleBar">
            <span class="TitleText">KimBH04.github.io<span class="TitlePath" id="title-path"></span></span>
            <span class="TitleButtons" aria-hidden="true"><span>_</span><span>□</span><span>×</span></span>
        </div>

        <header class="SiteHeader">
            <a class="Logo" href="/"><span class="LogoMark" aria-hidden="true"></span>KimBH04</a>
            <nav class="Nav" aria-label="메뉴">
                <a href="https://github.com/KimBH04" target="_blank" rel="noopener">GitHub ↗</a>
            </nav>
        </header>

        <nav class="SectionTabs" aria-label="섹션">
            <a class="SectionTab" href="/" data-section="posts">Posts</a>
            <a class="SectionTab" href="/game" data-section="game">Games</a>
            <a class="SectionTab" href="/art" data-section="art">Arts</a>
        </nav>

        <main class="Main" id="main">
            <noscript><p class="NoScript">이 블로그는 JavaScript 가 필요합니다.</p></noscript>
        </main>

        <footer class="StatusBar">
            <span class="Cell Grow">© <span id="year"></span> KimBH04</span>
            <span class="Cell" id="post-count" hidden></span>
            <span class="Cell"><time id="clock"></time></span>
        </footer>
    </div>
</body>

</html>
